<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已审成果 · 书论工作区</title><style>body{max-width:880px;margin:60px auto;padding:0 24px;background:#f7f6f2;color:#252b35;font:16px/1.8 system-ui}article{padding:22px 0;border-bottom:1px solid #ddd}a{color:#344f83}small{color:#667}h1{font-family:serif}li{overflow-wrap:anywhere}</style><a href="../annotation-tasks.html">← 返回书论工作区</a><h1>已审成果</h1><p>负责人审核发布的交付文件。正式语料及标注来源资格仍按原平台规则核验。</p><main id="list">正在加载…</main><script>fetch('index.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const root=document.querySelector('#list');root.replaceChildren();for(const x of d.deliveries){const a=document.createElement('article'),h=document.createElement('h2'),p=document.createElement('p'),ul=document.createElement('ul');h.textContent=x.memberName+' · '+x.scope;p.textContent='交付 '+x.submittedAt+' · 审核 '+x.reviewedAt;for(const f of x.files){const li=document.createElement('li'),link=document.createElement('a');link.textContent=f.name;link.href=encodeURIComponent(x.id)+'/files/'+encodeURIComponent(f.name);link.download=f.name;li.append(link);ul.append(li)}a.append(h,p,ul);root.append(a)}}).catch(()=>document.querySelector('#list').textContent='加载失败，请刷新重试。')</script></html>
